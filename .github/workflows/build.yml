name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The voice library and models are pinned by SHA-256 in the script, so the script is the cache key.
      - name: Cache voice library and models
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/voice
          key: voice-${{ hashFiles('scripts/fetch-voice.sh') }}

      - name: Fetch voice library and models
        run: scripts/fetch-voice.sh

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
