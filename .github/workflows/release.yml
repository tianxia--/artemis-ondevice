name: release

# Push a tag such as v0.2.0 (matching versionName in app/build.gradle.kts and a section in
# CHANGELOG.md) to build, sign and publish the APK as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache voice library and models
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/voice
          key: voice-${{ hashFiles('scripts/fetch-voice.sh') }}

      - name: Fetch voice library and models
        run: scripts/fetch-voice.sh

      - name: Check the tag matches versionName
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          [ "v$version" = "$TAG" ] || { echo "tag $TAG does not match versionName $version"; exit 1; }

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ARTEMIS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "secret ARTEMIS_RELEASE_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Gradle reads ORG_GRADLE_PROJECT_<name> as the gradle property <name>.
      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_ARTEMIS_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_ARTEMIS_RELEASE_STORE_PASSWORD: ${{ secrets.ARTEMIS_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ARTEMIS_RELEASE_KEY_ALIAS: ${{ secrets.ARTEMIS_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ARTEMIS_RELEASE_KEY_PASSWORD: ${{ secrets.ARTEMIS_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "artemis-ondevice-$TAG.apk"
          rm "$RUNNER_TEMP/release.jks"

      - name: Write release notes
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          cat .github/release-footer.md >> notes.md
          echo "" >> notes.md
          echo "SHA-256: \`$(sha256sum "artemis-ondevice-$TAG.apk" | cut -d' ' -f1)\`" >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "artemis-ondevice-$TAG.apk" --title "$TAG" --notes-file notes.md
